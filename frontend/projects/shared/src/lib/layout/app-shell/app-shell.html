<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__nav">
    <mat-nav-list>
      @for (link of navLinks(); track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell__toolbar">
      <span class="shell__title">{{ appTitle() }}</span>
      <span class="shell__spacer"></span>
      @if (userDisplayName(); as name) {
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          {{ name }}
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout.emit()">
            <mat-icon>logout</mat-icon>
            <span>Log out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="shell__content">
      <ng-content />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

# Static SPA serving for the Angular apps in this workspace. Client-side
# routing (client-portal's /portfolio, /subscriptions, /compliance-status)
# means any path not matching a real file must fall back to index.html —
# without this, a hard refresh/deep link on a routed page 404s.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # index.html must always be revalidated so a new deployment's hashed
    # asset references are picked up immediately, not served from a stale
    # browser/proxy cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build output (main-<hash>.js, styles-<hash>.css, ...) can be
    # cached aggressively — the filename itself changes on every build.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

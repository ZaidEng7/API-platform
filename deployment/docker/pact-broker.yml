services:
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
      POSTGRES_DB: pact_broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@pact-broker-db:5432/pact_broker
      # Dev/local only — no auth in front of the broker. A real deploy needs
      # PACT_BROKER_BASIC_AUTH_USERNAME/PASSWORD or WEBHOOK/READ_ONLY creds.
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
      PACT_BROKER_PORT: "9292"
    ports:
      - "9292:9292"
    depends_on:
      pact-broker-db:
        condition: service_healthy

# Chart defaults. Override per service in deployment/helm/values/<service>.yaml
# and per environment in deployment/environments/<env>/values.yaml.

nameOverride: ""

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080
  targetPort: 8080

# Plain env vars (rendered as literal strings — no secrets here; use envFrom
# + a Secret/ConfigMap reference for anything sensitive).
env: {}
envFrom: []

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

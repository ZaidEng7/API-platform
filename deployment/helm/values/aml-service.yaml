# Service-specific values for AML Service. See gateway.yaml for the full
# install command pattern. Same secrets caveat as customer-service.yaml
# applies to both the DB and RabbitMQ credentials here.

nameOverride: aml-service

image:
  repository: aml-service

service:
  port: 8093
  targetPort: 8093

env:
  DB_HOST: aml-service-postgres
  DB_PORT: "5432"
  DB_NAME: aml_service
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"

envFrom:
  - secretRef:
      name: aml-service-db
      optional: true
  - secretRef:
      name: aml-service-rabbitmq
      optional: true

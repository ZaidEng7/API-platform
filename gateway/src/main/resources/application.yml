spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - StripPrefix=0
            - id: kyc-service
              uri: ${KYC_SERVICE_URI:http://localhost:8092}
              predicates:
                - Path=/api/v1/kyc-checks/**
              filters:
                - StripPrefix=0
            - id: aml-service
              uri: ${AML_SERVICE_URI:http://localhost:8093}
              predicates:
                - Path=/api/v1/aml/**
              filters:
                - StripPrefix=0
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URI:http://localhost:8094}
              predicates:
                - Path=/api/v1/documents/**
              filters:
                - StripPrefix=0
            - id: fund-service
              uri: ${FUND_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/funds/**
              filters:
                - StripPrefix=0
            - id: portfolio-service
              uri: ${PORTFOLIO_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/portfolios/**
              filters:
                - StripPrefix=0
            - id: investment-service
              uri: ${INVESTMENT_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/subscriptions/**
              filters:
                - StripPrefix=0
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - StripPrefix=0
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - StripPrefix=0
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE]
                allowedHeaders: [Authorization, Content-Type, X-Correlation-Id]
                allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Empty by default: SecurityConfig stays fully open until this is set
          # (see platform/identity/README.md to point it at a local Keycloak).
          issuer-uri: ${GATEWAY_JWT_ISSUER_URI:}

server:
  port: ${SERVER_PORT:8080}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # sample everything — dev/demo scale only, revisit before prod
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  file:
    name: ${LOG_FILE_NAME:logs/gateway.log}

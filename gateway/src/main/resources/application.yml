spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE]
            allowedHeaders: [Authorization, Content-Type, X-Correlation-Id]
            allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Empty by default: SecurityConfig stays fully open until this is set
          # (see platform/identity/README.md to point it at a local Keycloak).
          issuer-uri: ${GATEWAY_JWT_ISSUER_URI:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  tracing:
    sampling:
      probability: 1.0 # sample everything — dev/demo scale only, revisit before prod
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  file:
    name: ${LOG_FILE_NAME:logs/gateway.log}

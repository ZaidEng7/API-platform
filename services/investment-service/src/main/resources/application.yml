spring:
  application:
    name: investment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investment_service}
    username: ${DB_USER:investment_service}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Empty by default: common-security's filter chain stays fully
          # open until this is set (see platform/identity/README.md).
          issuer-uri: ${INVESTMENT_SERVICE_JWT_ISSUER_URI:}

customer-service:
  base-url: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
kyc-service:
  base-url: ${KYC_SERVICE_URI:http://localhost:8092}
aml-service:
  base-url: ${AML_SERVICE_URI:http://localhost:8093}
portfolio-service:
  base-url: ${PORTFOLIO_SERVICE_URI:http://localhost:8088}

investment:
  subscription:
    # Guide §8.4: "every saga has a timeout and a dead-letter path" — how
    # long a subscription may sit AWAITING_PAYMENT before the scheduled
    # job (SubscriptionTimeoutJob) marks it TIMED_OUT.
    timeout: ${SUBSCRIPTION_TIMEOUT:PT15M}
    timeout-check-interval-ms: ${SUBSCRIPTION_TIMEOUT_CHECK_INTERVAL_MS:60000}

server:
  port: ${SERVER_PORT:8089}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # sample everything — dev/demo scale only, revisit before prod
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: ${LOG_FILE_NAME:logs/investment-service.log}
